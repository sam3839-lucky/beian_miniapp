<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #f2f0ed;
  min-height: 100vh;
  padding-bottom: 40px;
  -webkit-font-smoothing: antialiased;
}

/* ═══ 搜索栏 ═══ */
.search-bar { background:#fff; padding:12px 14px; position:sticky; top:0; z-index:10; }
.search-box { display:flex; align-items:center; background:#f5f3f0; border-radius:12px; padding:10px 14px; gap:8px; }
.search-icon { font-size:14px; }
.search-input { flex:1; font-size:14px; color:#1c1917; border:none; background:none; outline:none; }

/* ═══ 概览卡片 ═══ */
.overview { display:flex; padding:14px; gap:8px; }
.stat-card { flex:1; background:#fff; border-radius:12px; padding:14px 6px; text-align:center;
  display:flex; flex-direction:column; gap:2px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.stat-num { font-size:22px; font-weight:800; letter-spacing:-1px; }
.stat-num.green { color:#059669; }
.stat-num.red   { color:#dc2626; }
.stat-num.gray  { color:#78716c; }
.stat-num.blue  { color:#2563eb; }
.stat-label { font-size:11px; color:#a8a29e; font-weight:500; }

/* ═══ 状态占比条 ═══ */
.status-bar { margin:0 14px 6px; background:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.bar-track { height:8px; border-radius:4px; background:#f0efed; display:flex; overflow:hidden; }
.bar-seg { height:100%; }
.bar-seg.unsold     { background:#059669; }
.bar-seg.signed     { background:#f59e0b; }
.bar-seg.filed      { background:#f97316; }
.bar-seg.transferred { background:#d6d3d1; }
.bar-legend { display:flex; gap:10px; margin-top:8px; font-size:11px; color:#78716c; align-items:center; flex-wrap:wrap; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.dot.unsold     { background:#059669; }
.dot.signed     { background:#f59e0b; }
.dot.filed      { background:#f97316; }
.dot.transferred { background:#d6d3d1; }

/* ═══ Section ═══ */
.section { margin:14px 14px 0; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.section-title { font-size:16px; font-weight:700; color:#1c1917; }

/* ═══ 区域 chips ═══ */
.zone-chips { display:flex; flex-wrap:wrap; gap:8px; }
.zone-chip { padding:8px 14px; background:#fff; border-radius:20px; font-size:13px; color:#44403c;
  font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.04); cursor:pointer; transition:.15s; border:none; }
.zone-chip:active { background:#ecfdf5; color:#059669; }

/* ═══ 区域对比 ═══ */
.zone-compare { background:#fff; border-radius:12px; padding:10px 14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.zone-row { display:flex; align-items:center; gap:10px; padding:7px 0; }
.zone-row + .zone-row { border-top:1px solid #f5f3f0; }
.zname { font-size:13px; font-weight:600; color:#1c1917; width:52px; }
.zcount { font-size:12px; color:#059669; font-weight:600; width:40px; text-align:right; }
.zbar-wrap { flex:1; height:6px; border-radius:3px; background:#f0efed; overflow:hidden; }
.zbar { height:100%; border-radius:3px; background:linear-gradient(90deg, #059669, #34d399); transition:.3s; }
.zprice { font-size:12px; color:#78716c; width:56px; text-align:right; }

/* ═══ 榜单 ═══ */
.rank-tabs { display:flex; background:#fff; border-radius:12px 12px 0 0; overflow:hidden; }
.rank-tab { flex:1; text-align:center; padding:10px 0; font-size:13px; color:#78716c;
  border-bottom:2px solid transparent; cursor:pointer; transition:.2s; border:none; background:none; }
.rank-tab.on { color:#059669; border-color:#059669; font-weight:600; }
.rank-list { background:#fff; border-radius:0 0 12px 12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.rank-item { display:flex; align-items:center; padding:10px 14px; gap:10px; border-top:1px solid #f5f3f0; cursor:pointer; transition:.1s; }
.rank-item:active { background:#fafaf9; }
.rank-idx { font-size:14px; font-weight:800; color:#d6d3d1; width:20px; flex-shrink:0; }
.rank-item:nth-child(1) .rank-idx { color:#f59e0b; }
.rank-item:nth-child(2) .rank-idx { color:#a8a29e; }
.rank-item:nth-child(3) .rank-idx { color:#d97706; }
.rank-info { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
.rank-proj { font-size:13px; font-weight:600; color:#1c1917; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rank-unit { font-size:11px; color:#a8a29e; }
.rank-price { text-align:right; display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
.rp-total { font-size:15px; font-weight:700; color:#dc2626; }
.rp-unit { font-size:11px; color:#a8a29e; }

/* ═══ 预售证 ═══ */
.permit-scroll { display:flex; overflow-x:auto; gap:10px; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.permit-scroll::-webkit-scrollbar { display:none; }
.permit-card { flex-shrink:0; width:160px; background:#fff; border-radius:12px; padding:12px 14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04); display:flex; flex-direction:column; gap:4px; cursor:pointer; }
.permit-card:active { background:#fafaf9; }
.pm-zone { font-size:10px; color:#059669; background:#ecfdf5; align-self:flex-start; padding:2px 8px; border-radius:8px; }
.pm-name { font-size:13px; font-weight:600; color:#1c1917; line-height:1.3; }
.pm-dev  { font-size:10px; color:#a8a29e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pm-date { font-size:11px; color:#a8a29e; }
.pm-count { font-size:12px; color:#dc2626; font-weight:600; }

/* ═══ 计算器 ═══ */
.calc-card { background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.calc-row { display:flex; gap:10px; margin-bottom:12px; }
.calc-field { flex:1; display:flex; flex-direction:column; gap:4px; }
.calc-label { font-size:12px; color:#78716c; font-weight:500; }
.calc-input { padding:10px 12px; border-radius:10px; border:1px solid #e7e5e4; font-size:14px;

.calc-input:focus { border-color:#059669; }
.calc-btn { text-align:center; padding:12px; background:#059669; color:#fff; border-radius:10px;

.calc-btn:active { background:#047857; }
.calc-result { margin-top:12px; padding-top:12px; border-top:1px solid #f0efed; display:none; }
.calc-result.show { display:block; }
.cr-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:13px; color:#44403c; }
.cr-val { font-weight:700; color:#059669; font-size:14px; }
.cr-hint { text-align:right; font-size:11px; color:#059669; margin-top:6px; }

/* ═══ Page header ═══ */
.page-header { background:#fff; padding:14px 14px 8px; text-align:center; }
.page-header h1 { font-size:17px; font-weight:700; color:#1c1917; margin-bottom:2px; }
.page-header .sub { font-size:11px; color:#a8a29e; }
</style>

  document.getElementById('leg-signed').textContent = nf(overview.signed);
  document.getElementById('leg-filed').textContent = nf(overview.filed);
  document.getElementById('leg-trans').textContent = nf(overview.transferred);

  // Zone chips
  const chipContainer = document.getElementById('zone-chips');
  overview.zones.forEach(z => {
    const chip = document.createElement('button');
    chip.className = 'zone-chip';
    chip.textContent = z.name + ' ' + nf(z.count) + '套';
    chipContainer.appendChild(chip);
  });

  // Zone compare
  const cmpContainer = document.getElementById('zone-compare');
  const maxCount = overview.zones[0].count;
  overview.zones.forEach(z => {
    const row = document.createElement('div');
    row.className = 'zone-row';
    row.innerHTML = '<span class="zname">' + z.name + '</span>' +
      '<span class="zcount">' + nf(z.count) + '套</span>' +
      '<div class="zbar-wrap"><div class="zbar" style="width:' + (z.count/maxCount*100) + '%"></div></div>' +
      '<span class="zprice">' + z.avg_total + '万</span>';
    cmpContainer.appendChild(row);
  });

  // Rankings
  let rankTab = 0;
  const rankKeys = ['cheap_total', 'cheap_unit', 'small_area'];
  function renderRankings() {
    const list = document.getElementById('rank-list');
    list.innerHTML = '';
    const data = rankings[rankKeys[rankTab]];
    data.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'rank-item';
      div.innerHTML = '<span class="rank-idx">' + (i+1) + '</span>' +
        '<div class="rank-info"><span class="rank-proj">' + item.project_name + '</span>' +
        '<span class="rank-unit">' + item.unit_no + ' | ' + item.built_area + '㎡</span></div>' +
        '<div class="rank-price"><span class="rp-total">' + item.total_price + '万</span>' +
        '<span class="rp-unit">' + pnf(item.unit_price) + '万/㎡</span></div>';
      list.appendChild(div);
    });
  }
  renderRankings();

  document.getElementById('rank-tabs').addEventListener('click', function(e) {
    if (!e.target.classList.contains('rank-tab')) return;
    rankTab = parseInt(e.target.dataset.idx);
    this.querySelectorAll('.rank-tab').forEach(t => t.classList.toggle('on', t === e.target));
    renderRankings();
  });

  // Permits
  const pScroll = document.getElementById('permit-scroll');
  permits.forEach(p => {
    const card = document.createElement('div');
    card.className = 'permit-card';
    card.innerHTML = '<span class="pm-zone">' + p.zone + '</span>' +
      '<span class="pm-name">' + p.project_name + '</span>' +
      '<span class="pm-dev">' + p.developer + '</span>' +
      '<span class="pm-date">' + p.pass_date + '</span>' +
      (p.unsold > 0 ? '<span class="pm-count">可售 ' + p.unsold + ' 套</span>' : '');
    pScroll.appendChild(card);
  });

  // Calculator
  document.getElementById('calc-btn').addEventListener('click', function() {
    const down = parseFloat(document.getElementById('calc-down').value);
    const monthly = parseFloat(document.getElementById('calc-monthly').value);
    const result = document.getElementById('calc-result');
    if (!down || down <= 0 || !monthly || monthly <= 0) {
      result.classList.remove('show');
      return;
    }
    const totalLow = Math.round(down / 0.3);
    const totalHigh = Math.round(down / 0.2);
    const rate = 0.0315, months = 360, mr = rate/12;
    const factor = (mr * Math.pow(1+mr, months)) / (Math.pow(1+mr, months) - 1);
    const loanMax = Math.round(monthly * 10000 / factor);
    const affordMax = Math.round(down + loanMax);
    document.getElementById('cr-range').textContent = totalLow + '万 ~ ' + totalHigh + '万';
    document.getElementById('cr-loan').textContent = affordMax + '万';
    result.classList.add('show');
  });
})();
</script>

</body>
</html>
